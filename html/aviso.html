<!DOCTYPE html>
<html lang="es">
<head>
	<title>Form Validation</title>
    <link rel="stylesheet" type="text/css" href="../css/styles.css">
    <meta charset="UTF-8">
</head>
<body>
    <div class="main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg" hidden>Mensajes de validacion</h2>
            <ul id="val-list"></ul>
        </div>
        
        <form name="myForm" method="post" enctype="multipart/form-data">
            <h1>¿Dónde?:</h1>
            <label for="select-department">Cual es tu region?</label>
            <select name="select-department" id="select-department" required>
                <option value="">Seleccione una region</option>
            </select><br>

            <label for="select-course">Elige tu comuna</label>
            <select name="select-course" id="select-course" required>
                <option value="">Seleccione una comuna</option>
            </select><br>

            <label for="comments" hidden>Sector</label>
            <textarea name="comments" id="comments" maxlength="500" hidden></textarea>


            <h1>¿Contacto de esta publicación?:</h1>
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" minlength="3" maxlength="200" required><br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" maxlength="100" required><br>

            <label for="phone">Teléfono</label>
            <input type="text" name="phone" id="phone" minlength="8"><br>

            <label for="red-select">Selecciona una red social</label>
            <select id="red-select" name="red-select">
                <option value="">Elige una opción</option>
                <option value="whatsapp">WhatsApp</option>
                <option value="telegram">Telegram</option>
                <option value="x">X (Twitter)</option>
                <option value="instagram">Instagram</option>
                <option value="tiktok">TikTok</option>
                <option value="otra">Otra</option>
            </select>
            <div id="input-container"></div>

            <h1>¿Qué mascota ofrece en adopción?:</h1>
            <label for="select-department1">Perro o Gato?</label>
            <select name="select-department1" id="select-department1" required>
                <option value="">Selecciona</option>
            </select><br>

            <label for="cantidad">Cantidad</label>
            <input type="text" name="cantidad" id="cantidad" minlength="1" required><br>
            
            <label for="edad">Edad</label>
            <input type="text" name="edad" id="edad" minlength="1" required><br>
            
            <label for="select-department2">Meses o años</label>
            <select name="select-department2" id="select-department2" required>
                <option value="">Selecciona</option>
            </select><br>

            <label for="entrega">Fecha disponible</label>
            <input id="entrega" name="entrega" type="datetime-local" required step="60"><br>

            <label for="descripcion">Descripción</label>
            <textarea name="descripcion" id="descripcion" rows="10" cols="50" minlength="4" maxlength="500"></textarea><br>

            <label for="files">Fotos</label>
            <div id="file-container">
                <input type="file" id="files" name="files" class="file-input" accept="image/*,.pdf" required>
            </div>
            <button type="button" id="add-photo-btn">Agregar otra foto</button><br>

            <button id="submit-btn" type="button">Enviar</button>
        </form>
    </div>
    
    <script src="../js/select.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/fecha.js"></script>
</body>
</html>
